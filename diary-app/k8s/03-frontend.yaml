apiVersion: apps/v1
kind: Deployment
metadata:
  name: diary-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diary-frontend
  template:
    metadata:
      labels:
        app: diary-frontend
    spec:
      containers:
        - name: diary-frontend
          image: diary-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: diary-frontend
spec:
  selector:
    app: diary-frontend
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
