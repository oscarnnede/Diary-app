apiVersion: apps/v1
kind: Deployment
metadata:
  name: diary-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diary-backend
  template:
    metadata:
      labels:
        app: diary-backend
    spec:
      containers:
        - name: diary-backend
          image: diary-backend:latest
          imagePullPolicy: Never   # image is built straight into minikube's docker daemon
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://diary:diary@postgres:5432/diary
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: diary-backend
spec:
  selector:
    app: diary-backend
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080   # fixed so the frontend build (and you) can rely on it
